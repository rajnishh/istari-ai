name: Feature request
description: Suggest an idea or an integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why today's behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Istari to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to help test this
